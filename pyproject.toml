[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipdrift"
version = "0.1.0"
description = "Did you release what you merged? Finds merges with no tag, version bumps with no release, and docs pinning old builds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Athalla Jovian Maharsa" }]
keywords = ["release", "versioning", "git", "tags", "changelog", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/athallajovian9-cyber/shipdrift"
Issues = "https://github.com/athallajovian9-cyber/shipdrift/issues"

[project.scripts]
shipdrift = "shipdrift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["shipdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
